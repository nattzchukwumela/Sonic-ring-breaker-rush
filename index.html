<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
        />
        <meta name="theme-color" content="#041b4a" />
        <meta
            name="description"
            content="Sonic: Ringbreaker Rush — race through six stages and defeat Shroomdoom, Blackheart, and the Invader Overlord."
        />
        <title>Sonic: Ringbreaker Rush</title>
        <style>
            * { box-sizing: border-box; }
            html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #041b4a; }
            body { display: grid; place-items: center; }
            canvas { display: block; }
        </style>
    </head>
    <body>
        <div id="rotate-prompt" role="status" aria-label="Rotate your phone to landscape to play">
            <span class="rotate-prompt__icon" aria-hidden="true">↻</span>
            <strong>Rotate your phone</strong>
            <span>Play in landscape for the full game view.</span>
        </div>
        <script type="module" src="/src/main.js"></script>
    </body>
</html>
